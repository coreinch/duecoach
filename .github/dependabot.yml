version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Watches the Dockerfile's FROM line (python:3.13-slim); without this a
  # security patch to the base image never surfaces as a PR.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
